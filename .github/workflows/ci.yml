name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Run integration gates
        run: python gates.py
      - name: Run compatible-change reference
        run: python gate4_compatible_change.py
      - name: Run replay coordination gate
        run: python gate5_replay_coordination.py
      - name: Run continuous integration benchmark
        run: python gate6_continuous_learning.py --output /tmp/gate6.json
      - name: Run measured nonlinear transfer
        run: python gate7_measured_transfer.py --output /tmp/gate7.json
      - name: Install classifier example dependencies
        run: python -m pip install -r requirements-examples.txt
      - name: Run real-data adapter smoke check
        run: python digits_transfer.py --seeds 71 --steps 4 --output /tmp/digits.json
