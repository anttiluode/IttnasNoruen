name: Gate 12 full basis-action panel

on:
  pull_request:
    paths:
      - 'gate12_basis_action.py'
      - 'test_gate12_basis_action.py'
      - 'GATE12_PROTOCOL.md'
      - '.github/workflows/gate12_full.yml'
  workflow_dispatch:

jobs:
  full-gate12:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-examples.txt
      - name: Unit tests
        run: python -m pytest -q test_gate12_basis_action.py
      - name: Run preregistered three-seed Gate 12
        run: python gate12_basis_action.py --output /tmp/gate12.json
      - name: Print audit summary
        run: |
          python - <<'PY'
          import json
          r=json.load(open('/tmp/gate12.json'))
          print('checks', r['checks'])
          print('pass', r['pass'])
          for s in r['specimens']:
              print('\nSEED', s['seed'])
              for run in s['runs']:
                  basis=run.get('basis') or {}
                  geom=run.get('signature_geometry') or {}
                  print(run['method'],
                        'progress=', round(run['actual_progress'],6),
                        'calls=', run['calls'],
                        'stop=', run['stop_reason'],
                        'checkpoints=', len(run['checkpoints']),
                        'seen_loss=', run['final']['seen']['loss_rate_among_initially_correct'],
                        'unseen_loss=', run['final']['unseen']['loss_rate_among_initially_correct'],
                        'basis_ratio=', basis.get('max_tolerance_ratio'),
                        'condition=', geom.get('condition'))
          print('\nPAIRED qspan_equal - comparator (negative loss difference favors qspan_equal)')
          for row in r['paired']:
              print(row)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gate12-receipt
          path: /tmp/gate12.json
